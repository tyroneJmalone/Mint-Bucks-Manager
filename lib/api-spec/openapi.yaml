openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Mint Bucks promotional credit system for Mint Printworks
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: customers
    description: Customer management
  - name: credits
    description: Mint Bucks credit ledger
  - name: redemptions
    description: Credit redemptions
  - name: reports
    description: Reporting and analytics
  - name: settings
    description: App configuration and Printavo credentials
  - name: printavo
    description: Printavo integration — customer sync, order lookup, notifications
  - name: Storage
    description: Object storage upload and serving endpoints.

paths:
  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: File not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Customers ──────────────────────────────────────────────────────────────
  /customers:
    get:
      operationId: listCustomers
      tags: [customers]
      summary: List all customers
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: hasCredit
          in: query
          schema: { type: string }
      responses:
        "200":
          description: List of customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Customer"
    post:
      operationId: createCustomer
      tags: [customers]
      summary: Create a new customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerInput"
      responses:
        "201":
          description: Created customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"

  /customers/{id}:
    get:
      operationId: getCustomer
      tags: [customers]
      summary: Get customer by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "404":
          description: Not found
    patch:
      operationId: updateCustomer
      tags: [customers]
      summary: Update customer
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerUpdate"
      responses:
        "200":
          description: Updated customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "404":
          description: Not found
    delete:
      operationId: deleteCustomer
      tags: [customers]
      summary: Delete customer
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  /customers/{id}/credits:
    get:
      operationId: getCustomerCredits
      tags: [customers]
      summary: Get all credits for a customer
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Customer credits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Credit"

  # ── Credits ────────────────────────────────────────────────────────────────
  /credits:
    get:
      operationId: listCredits
      tags: [credits]
      summary: List credits
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - name: customerId
          in: query
          schema: { type: string }
        - name: expiringDays
          in: query
          schema: { type: string }
      responses:
        "200":
          description: List of credits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Credit"
    post:
      operationId: issueCredit
      tags: [credits]
      summary: Issue Mint Bucks to a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditInput"
      responses:
        "201":
          description: Issued credit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credit"

  /credits/{id}:
    get:
      operationId: getCredit
      tags: [credits]
      summary: Get credit by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Credit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credit"
        "404":
          description: Not found
    patch:
      operationId: updateCredit
      tags: [credits]
      summary: Update credit (status, expiry, note)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditUpdate"
      responses:
        "200":
          description: Updated credit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credit"
        "404":
          description: Not found
    delete:
      operationId: deleteCredit
      tags: [credits]
      summary: Cancel / delete a credit
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  /credits/{id}/redeem:
    post:
      operationId: redeemCredit
      tags: [credits]
      summary: Record a full or partial redemption
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedemptionInput"
      responses:
        "200":
          description: Redemption result with updated credit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedemptionResult"
        "400":
          description: Invalid redemption (e.g. insufficient balance)
        "404":
          description: Credit not found

  /credits/{id}/remind:
    post:
      operationId: sendCreditReminder
      tags: [credits]
      summary: Send email reminder to customer about available credit
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Reminder sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResult"
        "404":
          description: Credit not found

  /credits/check/{code}:
    get:
      operationId: checkCreditByCode
      tags: [credits]
      summary: Public balance check by credit code (no auth required)
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Credit balance info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditCheckResult"
        "404":
          description: Credit not found

  /credits/{id}/qr:
    get:
      operationId: getCreditQr
      tags: [credits]
      summary: Get QR code PNG for a credit
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: QR code PNG image
          content:
            image/png:
              schema:
                type: string
                format: binary

  /credits/{id}/certificate:
    get:
      operationId: getCreditCertificate
      tags: [credits]
      summary: Download branded PDF certificate for a credit
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: PDF certificate
          content:
            application/pdf:
              schema:
                type: string
                format: binary

  # ── Redemptions ────────────────────────────────────────────────────────────
  /redemptions:
    get:
      operationId: listRedemptions
      tags: [redemptions]
      summary: List all redemptions
      parameters:
        - name: customerId
          in: query
          schema: { type: string }
        - name: creditId
          in: query
          schema: { type: string }
      responses:
        "200":
          description: List of redemptions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Redemption"

  /redemptions/{id}:
    get:
      operationId: getRedemption
      tags: [redemptions]
      summary: Get redemption by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Redemption
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Redemption"
        "404":
          description: Not found

  # ── Reports ────────────────────────────────────────────────────────────────
  /reports/summary:
    get:
      operationId: getReportSummary
      tags: [reports]
      summary: Dashboard summary stats
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportSummary"

  /reports/credits-over-time:
    get:
      operationId: getCreditsOverTime
      tags: [reports]
      summary: Credits issued and redeemed per month
      parameters:
        - name: months
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Time series data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CreditTimePoint"

  /reports/top-customers:
    get:
      operationId: getTopCustomers
      tags: [reports]
      summary: Top customers by credits received
      parameters:
        - name: limit
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Top customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CustomerCreditStat"

  /reports/expiring-soon:
    get:
      operationId: getExpiringSoon
      tags: [reports]
      summary: Credits expiring within N days
      parameters:
        - name: days
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Expiring credits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Credit"

  # ── Settings ────────────────────────────────────────────────────────────────
  /settings/printavo:
    get:
      operationId: getSettingsPrintavo
      tags: [settings]
      summary: Get Printavo integration settings
      responses:
        "200":
          description: Current settings (API key is masked)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrintavoSettings"
    put:
      operationId: updateSettingsPrintavo
      tags: [settings]
      summary: Update Printavo integration settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrintavoSettingsInput"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrintavoSettings"

  /settings/email-templates:
    get:
      operationId: getEmailTemplates
      tags: [settings]
      summary: Get custom email verbiage for manual issue, manual reminder, and new-order notification emails
      responses:
        "200":
          description: Current templates (nulls = default verbiage)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailTemplates"
    put:
      operationId: updateEmailTemplates
      tags: [settings]
      summary: Update custom email verbiage templates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailTemplates"
      responses:
        "200":
          description: Updated templates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailTemplates"

  # ── Printavo ─────────────────────────────────────────────────────────────────
  /printavo/test:
    post:
      operationId: testPrintavoConnection
      tags: [printavo]
      summary: Test Printavo API connection
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrintavoTestInput"
      responses:
        "200":
          description: Connection test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrintavoConnectionResult"

  /printavo/sync-customers:
    post:
      operationId: syncPrintavoCustomers
      tags: [printavo]
      summary: Pull customers from Printavo and upsert into local table
      responses:
        "200":
          description: Sync summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrintavoSyncResult"
        "400":
          description: Printavo not configured

  /printavo/poll:
    post:
      operationId: triggerPrintavoPoll
      tags: [printavo]
      summary: Manually trigger a Printavo order poll
      responses:
        "200":
          description: Poll result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResult"

  /printavo/statuses:
    get:
      operationId: listPrintavoStatuses
      tags: [printavo]
      summary: List order statuses configured in the Printavo account
      responses:
        "200":
          description: Printavo statuses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PrintavoStatus"
        "400":
          description: Printavo not configured
        "502":
          description: Printavo API error

  /printavo/order/{orderNumber}:
    get:
      operationId: lookupPrintavoOrder
      tags: [printavo]
      summary: Fetch a Printavo order by order number for reference
      parameters:
        - name: orderNumber
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Order summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrintavoOrderSummary"
        "404":
          description: Order not found

  /printavo/notification-log:
    get:
      operationId: getNotificationLog
      tags: [printavo]
      summary: List automated Printavo credit notifications sent
      responses:
        "200":
          description: Notification log entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NotificationLogItem"

  /reports/activity:
    get:
      operationId: getRecentActivity
      tags: [reports]
      summary: Recent activity feed (credits + redemptions)
      parameters:
        - name: limit
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  # ── Rewards ──────────────────────────────────────────────────────────────────
  /rewards/settings:
    get:
      operationId: getRewardsSettings
      tags: [rewards]
      summary: Get rewards engine configuration
      responses:
        "200":
          description: Current rewards configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RewardsSettings"
    put:
      operationId: updateRewardsSettings
      tags: [rewards]
      summary: Update rewards engine configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RewardsSettingsInput"
      responses:
        "200":
          description: Updated configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RewardsSettings"

  /rewards/summary:
    get:
      operationId: getRewardsSummary
      tags: [rewards]
      summary: Rewards engine status and annual budget usage
      responses:
        "200":
          description: Rewards summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RewardsSummary"

  /rewards/rules:
    get:
      operationId: listRewardRules
      tags: [rewards]
      summary: List reward rules
      responses:
        "200":
          description: Reward rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RewardRule"
    post:
      operationId: createRewardRule
      tags: [rewards]
      summary: Create a reward rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RewardRuleInput"
      responses:
        "201":
          description: Created rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RewardRule"
        "400":
          description: Invalid rule

  /rewards/rules/{id}:
    patch:
      operationId: updateRewardRule
      tags: [rewards]
      summary: Update a reward rule
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RewardRuleUpdate"
      responses:
        "200":
          description: Updated rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RewardRule"
        "400":
          description: Invalid rule
        "404":
          description: Rule not found
    delete:
      operationId: deleteRewardRule
      tags: [rewards]
      summary: Delete a reward rule
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted
        "404":
          description: Rule not found

  /rewards/awards:
    get:
      operationId: listRewardAwards
      tags: [rewards]
      summary: List reward awards (optionally filtered by status)
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Reward awards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RewardAward"

  /rewards/awards/{id}/approve:
    post:
      operationId: approveRewardAward
      tags: [rewards]
      summary: Approve a pending award and issue its credit
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Approval result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResult"
        "400":
          description: Award cannot be approved
        "404":
          description: Award not found

  /rewards/awards/{id}/reject:
    post:
      operationId: rejectRewardAward
      tags: [rewards]
      summary: Reject a pending award
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Rejection result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResult"
        "404":
          description: Award not found

  /rewards/awards/{id}/unreject:
    post:
      operationId: unrejectRewardAward
      tags: [rewards]
      summary: Undo a decline, returning a rejected award to the pending queue
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Undo result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResult"
        "404":
          description: Award not found
        "409":
          description: Restoring the award would exceed the annual rewards limit

  /rewards/order-notes/{invoiceId}:
    put:
      operationId: upsertOrderNote
      tags: [rewards]
      summary: Create, update, or clear the internal staff note for a Printavo order
      parameters:
        - name: invoiceId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderNoteRequest"
      responses:
        "200":
          description: The saved note (note is null when cleared)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderNoteResult"

  /emails:
    get:
      tags: [credits]
      operationId: listEmailLog
      summary: List sent emails, optionally filtered by customer or credit
      parameters:
        - name: customerId
          in: query
          schema:
            type: integer
        - name: creditId
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Email log entries, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmailLogEntry"

  /rewards/test-email:
    post:
      tags: [rewards]
      operationId: sendTestRewardEmail
      summary: Send a test issuance or reminder email (no credit is created)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestEmailRequest"
      responses:
        "200":
          description: Test email sent.
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Email failed to send.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /rewards/scan:
    post:
      operationId: triggerRewardsScan
      tags: [rewards]
      summary: Manually run a rewards evaluation pass
      responses:
        "200":
          description: Scan result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RewardsScanResult"
        "400":
          description: Printavo not configured

  /rewards/pipeline:
    get:
      operationId: getRewardsPipeline
      tags: [rewards]
      summary: Preview potential Mint Bucks for unpaid/in-pipeline invoices
      responses:
        "200":
          description: Pipeline preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RewardsPipelineResult"
        "400":
          description: Printavo not configured
        "502":
          description: Failed to fetch from Printavo

components:
  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
        size:
          type: number
        contentType:
          type: string

    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
        objectPath:
          type: string

